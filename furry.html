<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fursonas | Emma</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: rgba(255, 255, 255, 0.05);
            --accent-primary: #ff79c6;
            --accent-secondary: #bd93f9;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 121, 198, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(189, 147, 249, 0.15) 0%, transparent 40%);
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        .header-section {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            background: linear-gradient(to right, #fff, var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-tagline {
            color: var(--accent-primary);
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.85rem;
            margin-bottom: 24px;
        }

        .sona-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .profile-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s ease;
            overflow: hidden;
        }

        .profile-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 121, 198, 0.3);
        }

        /* 16:9 Aspect Ratio Container */
        .sona-banner {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 16px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .sona-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sona-banner i {
            font-size: 3rem;
            color: white;
            opacity: 0.8;
        }

        .species-tag {
            color: var(--accent-primary);
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.85rem;
            margin-bottom: 10px;
            display: block;
        }

        h2 {
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .bio {
            color: var(--text-dim);
            line-height: 1.6;
            font-size: 1rem;
            padding: 0 10px 10px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 600px) {
            .sona-grid { grid-template-columns: 1fr; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h1>My Fursonas</h1>
        <p class="header-tagline">Personal Characters & Designs</p>
    </div>

    <div class="sona-grid">
        <!-- Fursona 1 -->
        <div class="profile-card">
            <div class="sona-banner">
                <img src="fursona1.png" alt="Novabeast Character">
            </div>
            <span class="species-tag">Novabeast</span>
            <h2>just a novabeast</h2>
            <p class="bio">
                just a novabeast. Features NSFW toggles. uses KFN base
            </p>
        </div>

        <!-- Fursona 2 -->
        <div class="profile-card">
            <div class="sona-banner">
                <i class="fas fa-moon"></i>
            </div>
            <span class="species-tag">Species Name</span>
            <h2>coming soon</h2>
            <p class="bio">
                Coming soon <3
            </p>
        </div>
    </div>

    <div class="social-links">
        <a href="index.html" class="btn btn-back">
            <i class="fas fa-arrow-left"></i> Back to Main Site
        </a>
    </div>
</div>

</body>
</html>
